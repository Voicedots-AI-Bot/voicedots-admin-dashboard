version: '3.8'

services:
  api-backend:
    build: .
    container_name: my_production_backend
    ports:
      # This maps [VPS Port]:[Container Port]
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      # This allows the container to talk to native VPS Postgres
      - "host.docker.internal:host-gateway"
    restart: unless-stopped